name: Deploy to GitHub Pages

# ============================================================
# 首次使用前请先做一件事（只需一次）：
#   仓库 → Settings → Pages → Build and deployment
#        → Source 选择 “GitHub Actions”
#
# 不先做这一步，第一次运行会在 configure-pages 报
#   “Get Pages site failed ... Error: Not Found”
# 补做之后点 Re-run all jobs 即可，不需要改任何代码。
# ============================================================

on:
  # 推送到 main 分支时自动构建并部署
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 发布 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务；新任务不取消进行中的线上发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        # 说明：仓库尚未提交 package-lock.json，因此这里用 npm install。
        # 若你在本地执行过 npm install 并提交了 package-lock.json，
        # 建议把下面一行改成 npm ci（更严格、更快）。
        run: npm install

      - name: 构建
        run: npm run build

      # 注意：这一步要求仓库已经启用 Pages。
      # 若仓库还没启用过 Pages，会报 “Get Pages site failed ... Error: Not Found”。
      # 这不是工作流写错了，而是 Pages 站点尚未创建：
      #   仓库 → Settings → Pages → Build and deployment → Source → GitHub Actions
      # 启用一次后，后续部署就永久正常了。
      #
      # 不要试图用 enablement: true 绕过：创建 Pages 站点属于仓库管理操作，
      # Actions 默认的 GITHUB_TOKEN 在设计上没有该权限，写什么 permissions 都无效，
      # 只会把报错换成 “Resource not accessible by integration”。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
